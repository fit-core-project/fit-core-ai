name: ai-ci

# Unit tests + stage-eval regression gate (replays committed LLM outputs; no GPU, no MySQL,
# no vector index). The full gate (food index, supplement Chroma, routine MySQL) runs locally:
#   python scripts/eval/regression_gate.py --profile full

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      AI_EMBEDDING_DEVICE: cpu
      # Same LLM routing as .env.example (no secrets): the replayed cache was recorded with it.
      APP_ENV: local
      LLM_PROVIDER: local
      LOCAL_LLM_MODEL: gemma4:latest
      ENABLE_LOCAL_RAW_JSON_INVOKE: "true"
      LOCAL_LLM_NUM_PREDICT: "4096"
      LOCAL_LLM_NUM_CTX: "8192"
      # No database in CI: anything that needs one must be marked integration.
      DATABASE_URL: mysql+pymysql://ci:ci@127.0.0.1:1/none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-slim.txt
      - name: Install (slim: no torch / chromadb / sentence-transformers)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-slim.txt pytest
      - name: Unit + offline harness tests
        run: pytest -q -p no:cacheprovider -m "not slow and not integration and not llm and not chroma and not smoke"
      - name: Stage-eval regression gate (diet, curated table)
        run: python scripts/eval/regression_gate.py --profile ci
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-eval-reports
          path: tests/evaluation/.artifacts/gate_*.md
          if-no-files-found: ignore
